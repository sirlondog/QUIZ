<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <title>Квиз — подбор компьютера | STAR-COMP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="wrap">
      <div class="header__bar">
        <a class="logo" href="https://star-comp.ru" aria-label="STAR-COMP — на главную">STAR<span>-</span>COMP</a>
      </div>
    </div>
  </header>

  <main class="page wrap">
    <button type="button" class="quiz-open" data-quiz-open>Подобрать компьютер</button>
  </main>

  <dialog class="quiz" id="quiz" aria-labelledby="quiz-title">
    <div class="quiz__card">

      <div class="quiz__progress" role="progressbar" aria-label="Прогресс квиза" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="quiz__progress-bar" style="width: 0%"></div>
      </div>

      <div class="quiz__top">
        <p class="quiz__counter">Шаг <span class="quiz__counter-current">1</span> из <span class="quiz__counter-total">4</span></p>
        <button type="button" class="quiz__close" aria-label="Закрыть квиз">&times;</button>
      </div>

      <div class="quiz__step is-active" data-step="1">
        <h2 class="quiz__title" id="quiz-title">Как будем подбирать?</h2>

        <div class="quiz__options">
          <button type="button" class="quiz__option" data-value="budget">
            <span class="quiz__option-title">Подберите под мой бюджет</span>
            <span class="quiz__option-text">Укажите бюджет и задачи, мы подберем</span>
          </button>

          <button type="button" class="quiz__option" data-value="self">
            <span class="quiz__option-title">Самостоятельно</span>
            <span class="quiz__option-text">Вышлем расчет стоимости по выбранным параметрам</span>
          </button>
        </div>
      </div>

      <div class="quiz__step" data-step="2">
        <h2 class="quiz__title">Укажите, для каких задач нужен компьютер</h2>

        <label class="quiz__field">
          <textarea class="quiz__input" rows="4" placeholder="Для игр, 3D-моделирования, для других задач"></textarea>
        </label>

        <div class="quiz__nav">
          <button type="button" class="quiz__back">Назад</button>
          <button type="button" class="quiz__next">Далее</button>
        </div>
      </div>

      <div class="quiz__step" data-step="3">
        <h2 class="quiz__title">Укажите примерный бюджет на компьютер</h2>

        <div class="budget">
          <output class="budget__amount">155 000 ₽</output>
          <input type="range" class="budget__slider" min="100000" max="600000" step="5000" value="155000" aria-label="Примерный бюджет">
          <div class="budget__range">
            <span>100 000 ₽</span>
            <span>600 000 ₽</span>
          </div>
        </div>

        <div class="quiz__nav">
          <button type="button" class="quiz__back">Назад</button>
          <button type="button" class="quiz__next">Далее</button>
        </div>
      </div>

      <div class="quiz__step" data-step="4">
        <h2 class="quiz__title">Как с вами связаться?</h2>

        <div class="quiz__options">
          <button type="button" class="quiz__option quiz__option--contact" data-value="phone">
            <span class="quiz__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
            </span>
            <span class="quiz__option-title">По телефону</span>
            <span class="quiz__option-note">Перезвоним</span>
          </button>

          <button type="button" class="quiz__option quiz__option--contact" data-value="messenger">
            <span class="quiz__option-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>
            </span>
            <span class="quiz__option-title">Мессенджер</span>
            <span class="quiz__option-note">Напишем в Telegram или MAX</span>
          </button>
        </div>

        <div class="quiz__nav">
          <button type="button" class="quiz__back">Назад</button>
        </div>
      </div>

    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
